<style>
:root{--bg:#f3efe8;--ink:#1d1b19;--accent:#2f5d50}
@media(prefers-color-scheme:dark){:root{--bg:#16181a;--ink:#ece8e1;--accent:#8fc4b2}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Georgia,"Times New Roman",serif;padding:2rem 1rem 3rem}
header{max-width:1000px;margin:0 auto 1.5rem}
h1{font-size:clamp(2rem,7vw,3.5rem);margin:0;letter-spacing:-.02em}
p{margin:.4rem 0 0;color:var(--accent);font-family:system-ui,sans-serif}
.grid{max-width:1000px;margin:0 auto;columns:3 220px;column-gap:12px}
.tile{display:block;width:100%;margin:0 0 12px;padding:0;border:0;background:none;cursor:pointer;break-inside:avoid;border-radius:6px;overflow:hidden}
.tile img{display:block;width:100%;height:auto;transition:transform .25s}
.tile:hover img{transform:scale(1.03)}
.tile:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
dialog{border:0;padding:0;background:transparent;max-width:96vw;max-height:96vh}
dialog::backdrop{background:rgba(0,0,0,.88)}
dialog img{display:block;max-width:96vw;max-height:90vh;margin:auto;border-radius:6px}
.bar{display:flex;justify-content:space-between;margin-top:8px}
.bar button{background:#fff;color:#000;border:0;border-radius:6px;padding:.6rem 1rem;font-size:1rem;cursor:pointer}
</style></head><body>
